[package]
name = "dx-preview"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dioxus component preview registry and catalog."
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
benchmark-support = []
catalog = [
  "csr",
  "dep:pulldown-cmark",
  "dioxus/document",
  "dioxus/hooks",
  "dioxus/router",
  "dioxus/signals",
]
csr = ["dep:web-sys", "dioxus/launch", "dioxus/web"]

[dependencies]
const_format.workspace = true
dioxus = { workspace = true, features = ["html", "macro"] }
dx-preview-macros = { path = "../dx-preview-macros" }
inventory.workspace = true
pulldown-cmark = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Location"], optional = true }

[dev-dependencies]
dioxus = { workspace = true, features = ["lib"] }

[lints]
workspace = true
