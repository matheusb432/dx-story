[package]
name = "dx-story"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dioxus component story registry and catalog."
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "../../README.md"
documentation = "https://docs.rs/dx-story"
keywords = ["dioxus", "storybook", "components", "catalog", "ui"]
categories = ["gui", "development-tools", "web-programming"]
include = ["src/**", "examples/**", "tests/**", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
benchmark-support = []
catalog = [
  "csr",
  "dep:pulldown-cmark",
  "dioxus/document",
  "dioxus/hooks",
  "dioxus/router",
  "dioxus/signals",
]
csr = ["dep:web-sys", "dioxus/launch", "dioxus/web"]

[dependencies]
const_format.workspace = true
dioxus = { workspace = true, features = ["html", "macro"] }
dx-story-macros.workspace = true
inventory.workspace = true
pulldown-cmark = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["Location"], optional = true }

[dev-dependencies]
dioxus = { workspace = true, features = ["lib"] }

[lints]
workspace = true

[[example]]
name = "component-catalog"
required-features = ["catalog"]
