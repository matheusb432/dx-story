[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
xtk-test = { version = "0.10.2", features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
