[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = [
  "crates/dx-story",
  "crates/dx-story-cli",
  "crates/dx-story-macros",
]

[workspace.package]
authors = ["Matheus Bastos <matheus.mab432@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/matheusb432/dx-story"
rust-version = "1.98"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
cargo_metadata = "0.23.1"
clap = { version = "4", features = ["derive"] }
clap-cargo = "0.18.3"
command-group = "5.0.1"
const_format = "0.2.36"
ctrlc = { version = "3.5.2", features = ["termination"] }
dioxus = { version = "0.7.10", default-features = false }
dx-story-macros = { version = "=0.1.0", path = "crates/dx-story-macros" }
inventory = "0.3.24"
nix = { version = "0.31.3", features = ["process", "signal", "term"] }
predicates = "3"
prettyplease = "0.3.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
  "html",
] }
quote = "1.0.46"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.3", default-features = false, features = [
  "clone-impls",
  "full",
  "parsing",
  "printing",
  "proc-macro",
] }
tempfile = "3.27.0"
toml = "1.1.2"
toml_edit = "0.25.13"
trybuild = "1.0.120"
walkdir = "2.5.0"
web-sys = "0.3.102"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
disallowed_methods = "deny"
collection_is_never_read = "warn"
struct_field_names = "allow"
